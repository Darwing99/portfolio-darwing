<footer class="footer">
  <div class="container footer__inner">
    <span>&copy; {{ year }} {{ profile.name }}</span>

    <div class="footer__socials">
      <a [href]="'mailto:' + profile.email" aria-label="Email">
        <app-icon name="mail"></app-icon>
      </a>
      <a [href]="profile.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
        <app-icon name="linkedin"></app-icon>
      </a>
      <a [href]="profile.github" target="_blank" rel="noopener" aria-label="GitHub">
        <app-icon name="github"></app-icon>
      </a>
    </div>

    <span class="footer__built">{{ i18n.t(ui.footer.built) }}</span>
  </div>
</footer>
