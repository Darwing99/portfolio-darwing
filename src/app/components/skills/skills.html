<section class="section" id="skills">
  <div class="container">
    <app-section-header
      [eyebrow]="ui.skills.eyebrow"
      [title]="ui.skills.title"
      [lead]="ui.skills.lead"
    ></app-section-header>

    <div class="skills__grid">
      @for (group of groups; track group.id; let i = $index) {
        <div class="skills__table card" [appReveal]="i * 70">
          <div class="skills__table-head">
            <div class="skills__table-heading">
              <app-icon [name]="iconFor(group.id)" class="skills__table-icon"></app-icon>
              <span class="skills__table-name">{{ group.id }}</span>
            </div>
            <span class="skills__table-label">{{ i18n.t(group.label) }}</span>
          </div>
          <ul class="skills__table-rows">
            @for (item of group.items; track item) {
              <li>
                <span class="skills__row-key">·</span>
                {{ item }}
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
